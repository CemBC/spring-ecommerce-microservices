spring.application.name=saga-monitor-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saga_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8090

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=saga-monitor
spring.kafka.consumer.auto-offset-reset=earliest

services.order.url=${ORDER_SERVICE_URL:http://localhost:8084}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8085}

saga.timeout-ms=${SAGA_TIMEOUT_MS:60000}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
